spring.application.name=meet_now
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2MB
server.port=8080
server.ssl.enabled=false

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/mnd-test?useUnicode=true&characterEncoding=UTF-8
spring.datasource.connection-properties=useUnicode=true;characterEncoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.datasource.username=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true


app.firebase.config.path=classpath:meetnowapp-8c0a1-firebase-adminsdk-fbsvc-03e56a1da7.json
spring.fcm.enabled=true

logging.level.com.efedotov.meet_now.meet_now.service.notification=DEBUG