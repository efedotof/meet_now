spring.application.name=meet_now
server.port=8080
server.ssl.enabled=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=100MB

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG
logging.level.com.efedotov.meet_now.meet_now.service.notification=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/mnd-test?useUnicode=true&characterEncoding=UTF-8
spring.datasource.connection-properties=useUnicode=true;characterEncoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

app.firebase.config.path=classpath:meetnowapp-8c0a1-firebase-adminsdk-fbsvc-03e56a1da7.json
spring.fcm.enabled=true

spring.boot.admin.context-path=/admin
spring.boot.admin.client.url=https://api.mnapp.ru
spring.boot.admin.ui.brand=MeetNow Admin
spring.boot.admin.notify.mail.enabled=false
spring.boot.admin.ui.favicon=https://api.mnapp.ru/favicon.ico
spring.boot.admin.ui.logo=https://api.mnapp.ru/favicon.ico
spring.boot.admin.ui.login-icon=https://api.mnapp.ru/favicon.ico
spring.boot.admin.ui.title=MeetNow Admin



management.endpoints.web.exposure.include=health,info,metrics,env,loggers,beans,configprops,mappings
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.health=health
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST


spring.websocket.sockjs.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.config-url=/api-docs/swagger-config
springdoc.api-docs.enabled=true
springdoc.show-actuator=true


spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

spring.mvc.async.request-timeout=30000
spring.main.banner-mode=off

spring.main.lazy-initialization=false

spring.main.allow-bean-definition-overriding=true