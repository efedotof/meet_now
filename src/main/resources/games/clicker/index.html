<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Элегантный Кликер</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="game-container">
        <div class="header">
            <h1><i class="fas fa-sparkles"></i> Кликер</h1>
            <p>Кликайте по кристаллу!</p>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Очки</div>
                <div id="score" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Кликов</div>
                <div id="total-clicks" class="stat-value">0</div>
            </div>
        </div>

        <div id="click-area" class="click-area">
            <div class="crystal"></div>
            <div class="shine"></div>
            <div class="click-text">КЛИКНИТЕ!</div>
        </div>
        <div class="footer">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p>Цель: <span id="goal-text">10 000 000</span> кликов</p>
            <p class="progress-text">Прогресс: <span id="progress-text">0%</span></p>
        </div>

        <div class="effects-container" id="effects-container"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
